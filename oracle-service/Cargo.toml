[package]
name = "ust1-oracle-service"
version.workspace = true
edition.workspace = true
description = "Polls Venus vFDUSD exchange rate on BSC and updates ust1-oracle on Terra Classic"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ust1-oracle-service"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "signal", "time"] }
alloy = { version = "0.8", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6"
url = "2.5"
dotenvy = "0.15"
cosmwasm-std = { workspace = true }
cosmrs = { version = "0.16", features = ["bip32", "cosmwasm"] }
bip39 = "2.0"
base64 = "0.22"
ust1-common = { path = "../smartcontracts-terraclassic/packages/ust1-common" }
ust1-oracle = { path = "../contracts/ust1-oracle", features = ["library"] }
secrecy = "0.10.3"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
regex = "1"
