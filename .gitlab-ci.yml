# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#customizing-analyzer-behavior
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
variables:
  SECRET_DETECTION_ENABLED: 'true'
  CARGO_TERM_COLOR: always

# INV-SCHEMA-001 / issue #21: pin InstantWithdrawCw20 against ustr-cmm treasury.
# Requires network to fetch the pinned git dep (same as local `cargo test`).
rust:
  stage: test
  image: rust:1.88-bookworm
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - target/
      - /usr/local/cargo/registry/
      - /usr/local/cargo/git/
  before_script:
    - rustup component add rustfmt clippy
    - apt-get update -qq && apt-get install -y -qq git pkg-config libssl-dev
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    - bash scripts/verify_treasury_wire_schema.sh

# TEST-16 / GitLab #28: optional LocalTerra-gated smoke (skip-clean when LCD down).
# Always-on rust job already runs wiremock DeliverTx-reject + BSC hang + skip-path tests.
# Owner: PlasticDigits. Promote to required only after deploy_local.py stores wasm.
localterra-e2e:
  stage: test
  image: rust:1.88-bookworm
  when: manual
  allow_failure: true
  needs: ["rust"]
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - target/
      - /usr/local/cargo/registry/
      - /usr/local/cargo/git/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git pkg-config libssl-dev curl
  script:
    - bash scripts/localterra_e2e_smoke.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

secret_detection:
  stage: secret-detection
include:
- template: Security/Secret-Detection.gitlab-ci.yml
