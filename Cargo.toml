[workspace]
resolver = "2"
members = [
  "smartcontracts-terraclassic/packages/ust1-common",
  "smartcontracts-terraclassic/contracts/ust1-oracle",
  "smartcontracts-terraclassic/contracts/ust1-window",
  "smartcontracts-terraclassic/contracts/cmm-native-wrap",
  "smartcontracts-terraclassic/tests",
  "oracle-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Required for `cargo publish -p <member>`: path deps must also declare a version so the
# published crate manifest resolves from crates.io (path is stripped on publish).
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/PlasticDigits/ust1-window"

[workspace.dependencies]
cosmwasm-std = { version = "1.5.11", features = ["staking"] }
cosmwasm-schema = "1.5.9"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
cw20 = "1.1.2"
cw20-base = { version = "1.1.2", features = ["library"] }
cw-utils = "1.0.3"
cw-multi-test = "1.2.0"
thiserror = "1.0.4"
schemars = "0.8.15"
serde = { version = "1.0.188", default-features = false, features = ["derive"] }
ust1-common = { path = "smartcontracts-terraclassic/packages/ust1-common", version = "0.1.0" }
ust1-cmm = { git = "https://gitlab.com/PlasticDigits/ust1-window.git", rev = "9623780189ba433122f43657f712a3492cf71341" }
ust1-oracle = { path = "smartcontracts-terraclassic/contracts/ust1-oracle", version = "0.1.1", features = [
  "library",
] }
cw20-mintable = { git = "https://github.com/PlasticDigits/cw20-mintable", rev = "73a206b5c39c5bd8f9d3574bda32fc5ae8f52ec8", features = ["library"] }
proptest = "1"

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
lto = true
codegen-units = 1
