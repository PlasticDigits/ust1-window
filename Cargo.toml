[workspace]
resolver = "2"
members = [
  "smartcontracts-terraclassic/packages/ust1-common",
  # Must be under top-level `contracts/` — CosmWasm bob only builds that prefix.
  "contracts/*",
  "smartcontracts-terraclassic/tests",
  "oracle-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Required for `cargo publish -p <member>`: path deps must also declare a version so the
# published crate manifest resolves from crates.io (path is stripped on publish).
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/PlasticDigits/ust1-window"

[workspace.dependencies]
cosmwasm-std = { version = "1.5.11", features = ["staking"] }
cosmwasm-schema = "1.5.9"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
cw20 = "1.1.2"
cw20-base = { version = "1.1.2", features = ["library"] }
cw-utils = "1.0.3"
cw-multi-test = "1.2.0"
thiserror = "1.0.4"
schemars = "0.8.15"
serde = { version = "1.0.188", default-features = false, features = ["derive"] }
serde_json = "1.0"
ust1-common = { path = "smartcontracts-terraclassic/packages/ust1-common", version = "0.1.0" }
ust1-cmm = { git = "https://gitlab.com/PlasticDigits/ust1-window.git", rev = "9623780189ba433122f43657f712a3492cf71341" }
# Pinned PlasticDigits2/ustr-cmm treasury (InstantWithdrawCw20 schema authority).
# Dev/test only — never add to ust1-window wasm production deps.
# Keep in sync with `ust1_window::treasury::USTR_CMM_TREASURY_SCHEMA_REV`,
# `contracts/ust1-window/testdata/instant_withdraw_cw20_golden.json`, and
# `skills/window-instant-withdraw-cw20` / docs/DEPLOYMENT.md (#21 / audit C-1).
cmm-treasury = { package = "treasury", git = "https://gitlab.com/PlasticDigits2/ustr-cmm.git", rev = "e6c4b7cf33f2f56d21c0e9fb2828efe87f032ded", default-features = false, features = ["library"] }
ust1-oracle = { path = "contracts/ust1-oracle", version = "0.1.2", features = [
  "library",
] }
# M-8 / INV-MINTER-001 (ust1-window#25): UpdateMinter clears old primary from MINTERS.
cw20-mintable = { git = "https://github.com/PlasticDigits/cw20-mintable", rev = "8a50c360e6c0e961062e6fa0e6f10e780c3b8ae8", features = ["library"] }
proptest = "1"

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
lto = true
codegen-units = 1
