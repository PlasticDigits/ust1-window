name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: InstantWithdrawCw20 schema pin (ustr-cmm)
        # Clones pinned PlasticDigits2/ustr-cmm rev and checks golden JSON + Rust conformance.
        # Requires network for the git dep (issue #21 / INV-SCHEMA-001).
        run: |
          chmod +x scripts/verify_treasury_wire_schema.sh
          scripts/verify_treasury_wire_schema.sh

  # TEST-16 / GitLab #28: optional LocalTerra-gated smoke (exits 0/SKIP without LCD).
  # Always-on `rust` job covers wiremock DeliverTx-reject + BSC hang + policy skips.
  localterra-e2e:
    runs-on: ubuntu-latest
    needs: [rust]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: LocalTerra e2e smoke (skip if LCD down)
        run: |
          chmod +x scripts/localterra_e2e_smoke.sh
          bash scripts/localterra_e2e_smoke.sh
